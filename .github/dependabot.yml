version: 2
updates:
  # Templates now ship package.json for Dependabot (generated from package/index.js).
  # Keep package/ as source of truth; package.json is snapshot for scanning.
  - package-ecosystem: npm
    directories:
      - /templates/*
      - /extensions/*
      - /templates/nextjs-saas-ai-starter/tools/danger
    schedule:
      interval: weekly
    ignore:
      # Prisma 7 needs schema/config migration in nextjs-prisma.
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # jsdom 30 breaks @testing-library/dom getComputedStyle (font-sizes.js:116) — see #341
      - dependency-name: jsdom
        versions: [">=30"]
    groups:
      devDependencies:
        dependency-type: development
      productionDependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

---
name: "🚀 Feature Request"
description: Suggest an idea for this project
title: "(short issue description)"
labels: [feature-request]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      description: A clear and concise description of the feature you are proposing.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Why do you need this feature?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Suggest how to implement the addition or change.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version used
    validations:
      required: true
